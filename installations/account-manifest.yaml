  - id: ollama
    category: local_ai
    status: DEFERRED_TO_ROCKY
    maturity: M2_CONTROLLED
    role: "Lightweight local model runtime and local API"
    exposure_policy: localhost_only
    hardware_policy: "Use small quantized models appropriate for the Core i5 host"

  - id: activepieces
    category: workflow_automation
    status: DEFERRED_TO_ROCKY
    maturity: M1_IDENTIFIED
    role: "Self-hosted workflow automation"

  - id: beszel
    category: observability
    status: DEFERRED_TO_ROCKY
    maturity: M1_IDENTIFIED
    role: "Lightweight host and container monitoring"

recovery_gates:
  - id: G1
    name: operating_system_integrity
    required_mode: H1_HUMAN_LED
    evidence:
      - dnf_check
      - systemd_failed_units_review
      - storage_and_usb_validation
  - id: G2
    name: container_runtime
    required_mode: H4_AGENT_EXECUTED_HUMAN_GATED
    evidence:
      - docker_info
      - compose_version
      - hello_world_container
  - id: G3
    name: secured_management
    required_mode: H2_HUMAN_LED_AI_ASSISTED
    evidence:
      - cockpit_active
      - portainer_private_binding
      - firewall_review
      - access_review
  - id: G4
    name: local_ai
    required_mode: H3_AI_LED_HUMAN_SUPERVISED
    evidence:
      - ollama_service_active
      - localhost_api_test
      - hardware_capacity_review
      - small_model_smoke_test
  - id: G5
    name: agent_and_mcp_layer
    required_mode: H4_AGENT_EXECUTED_HUMAN_GATED
    evidence:
      - context7_test
      - datagouv_read_only_test
      - openskills_sync
      - omniroute_health_check
  - id: G6
    name: production_readiness
    required_mode: H1_HUMAN_LED
    evidence:
      - transversal_control_review
      - backups
      - monitoring
      - secrets_externalized
      - rollback_test
      - access_review
      - cost_and_exit_plan
      - owner_acceptance
